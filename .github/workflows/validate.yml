name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck dosfstools e2fsprogs fdisk
      - name: Lint, configuration, unit and static checks
        run: bash scripts/validate.sh
      - name: Disposable image mechanics
        run: sudo bash tests/image-mechanics.sh
